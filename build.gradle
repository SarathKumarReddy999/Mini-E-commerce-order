plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5' // Rolled back to a stable release
    id 'io.spring.dependency-management' version '1.1.7' // Kept at 1.1.7!
}

group = 'com.ecommerce'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// 1. Define the Spring Cloud release version
ext {
    set('springCloudVersion', "2023.0.1")
}

dependencies {
    // Standard Boot dependencies (fixed 'webmvc' and 'h2console' to the standard starters)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 2. Add the Eureka Client dependency
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
}

// 3. The Dependency Management block (Master Dictionary for Spring Cloud)
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}